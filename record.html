            <h1>巴菲特致股东的信｜核心精华</h1>
            <blockquote>股票市场的存在，是为了让我们拥有优质企业的所有权，而非频繁交易赚取差价。</blockquote>
            <p>1、投资的核心是分辨<a class="key" href="intrinsic.html">内在价值</a>与市场价格，股价波动不代表企业价值变化，<a class="key" href="mrmarket.html">市场先生</a>的情绪不值得跟随。</p>
            <p>2、终身坚持<a class="key" href="circle.html">能力圈</a>原则，不懂的行业、看不懂的商业模式，坚决不参与。</p>
            <p>3、任何优质企业，失去<a class="key" href="margin.html">安全边际</a>的低价，都会变成糟糕的投资。</p>
            <p>4、优先长期持有拥有宽阔<a class="key" href="moat.html">经济护城河</a>的企业，享受企业成长带来的<a class="key" href="compound.html">复利效应</a>。</p>
            <blockquote>保住本金是投资第一准则，一次巨额亏损，足以摧毁十年复利成果。</blockquote>
