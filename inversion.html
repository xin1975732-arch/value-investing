            <h1>逆向思维｜反过来想问题</h1>
            <h3>概念来源</h3>
            <p>芒格终身核心思维法则，贯穿《穷查理宝典》全书，是顶级投资者、创业者的通用思维方式。</p>
            <h3>核心定义</h3>
            <p>普通人思考：如何快速赚钱、如何战胜市场；</p>
            <p>高手思考：<strong>什么行为一定会亏钱、什么操作一定会失败，我坚决避开</strong>。</p>
            <p>逆向思维不是单纯和市场反着来，是规避大概率错误，留存大概率正确的机会。</p>
            <h3>投资实战应用</h3>
            <p>1、避开追高、满仓、杠杆、频繁交易四大亏钱行为；</p>
            <p>2、市场狂热时冷静，市场恐慌时理性观察；</p>
            <p>3、不追求短期暴利，优先追求长期不亏。</p>
